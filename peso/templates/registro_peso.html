{% load static %}

<!DOCTYPE html>

<html lang="es">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de Peso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

      rel="icon"

      type="icon"

      href="{% static 'imagenes/logo.png' %}"

      class="icon"

    />

    <link rel="stylesheet" href="{% static 'css/inicio.css' %}" />

    <link rel="stylesheet" href="{% static 'css/registro_peso.css' %}" />

    <link rel="stylesheet" href="{% static 'css/base/normalize.css' %}" />

    <link

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600&display=swap"

      rel="stylesheet"

    />

    <link

      rel="stylesheet"

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"

    />

    </head>

  <body>

    <div class="container">

    {% include "layouts/navegacion.html" %}

    <main class="main-content">

        <h1><i class="fas fa-weight"></i> Registro de Peso Corporal</h1>

        <div class="peso-page-container">

            

                        <form id="peso-form" onsubmit="event.preventDefault(); registrarPeso(event);">

            {% csrf_token %}

                <div class="peso-registro-panel">

                    <div class="peso-section">

                        <h2><i class="fas fa-plus-circle"></i> Nuevo Registro</h2>

                        

                        <div class="peso-input-group">

                            <label for="peso-actual">Peso actual:</label>

                            <input type="number" id="peso-actual" name="peso" step="0.1" min="0" max="500" placeholder="0.0" required>

                            <span>kg</span>

                        </div>

                        

                        <button type="submit" class="btn-registro-peso">

                            <i class="fas fa-save"></i> Registrar Peso

                        </button>

                        

                        <div class="peso-stats">

                            <div class="stat-item">

                                <h4>Último Peso</h4>

                                <span id="ultimo-peso">-- kg</span>

                            </div>

                            <div class="stat-item">

                                <h4>Cambio Reciente</h4>

                                <span id="cambio-reciente">-- kg</span>

                            </div>

                            <div class="stat-item">

                                <h4>Total Registros</h4>

                                <span id="total-registros">0</span>

                            </div>

                        </div>

                    </div>

                </div>

            </form>

                                            <div class="peso-historial-panel">

                    <h2><i class="fas fa-chart-line"></i> Historial de Peso</h2>

                    

                                        <div class="peso-filtros">

                        <button type="button" class="btn-filtro active" onclick="filtrarRegistros('todos', event)">Todos</button>

                        <button type="button" class="btn-filtro" onclick="filtrarRegistros('ultimo_mes', event)">30 días</button>

                        <button type="button" class="btn-filtro" onclick="filtrarRegistros('3_meses', event)">90 días</button>

                    </div>

                    

                                        <div class="peso-table-container">

                        <table class="peso-comparison-table">

                            <thead>

                                <tr>

                                    <th>Fecha</th>

                                    <th>Peso</th>

                                    <th>Cambio</th>

                                    <th>Acciones</th>

                                </tr>

                            </thead>

                            <tbody id="peso-comparison-body">

                                                            </tbody>
                        </table>

                    </div>

                </div>

                            </div>


        </main>

    {% include "layouts/footer.html" %}



<script src="{% static 'js/peso.js' %}"></script>

</body>

</html>
